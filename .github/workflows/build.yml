name: Build macOS app

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run build checks
        run: make test
      - name: Build disk image
        run: make dmg
      - name: Verify signature
        run: codesign --verify --deep --strict --verbose=2 build/DriveSweep.app
      - name: Upload disk image
        id: upload_disk_image
        # The DMG is a convenience artifact.  A transient GitHub Artifact
        # service failure must not turn a build/test/signing success red.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: DriveSweep
          path: build/DriveSweep.dmg
          if-no-files-found: error
      - name: Report artifact upload issue
        if: steps.upload_disk_image.outcome == 'failure'
        run: echo "::warning title=DMG artifact unavailable::The app built, tested, and passed signature verification, but GitHub's Artifact service did not accept this optional upload. Retry the workflow to obtain the convenience artifact."
